<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка стоимости квартиры</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Оценка стоимости недвижимости</h1>
        <form id="evaluation-form">
            <div class="form-group">
                <label for="floor">Этаж:</label>
                <input type="number" id="floor" name="floor" required min="1">
            </div>
            <div class="form-group">
                <label for="total_floors">Количество этажей в доме:</label>
                <input type="number" id="total_floors" name="total_floors" required min="1">
            </div>
            <div class="form-group">
                <label for="rooms">Количество комнат:</label>
                <input type="number" id="rooms" name="rooms" required min="1">
            </div>
            <div class="form-group">
                <label for="total_area">Общая площадь (м²):</label>
                <input type="number" id="total_area" name="total_area" step="0.1" required min="1">
            </div>
            <div class="form-group">
                <label for="living_area">Жилая площадь (м²):</label>
                <input type="number" id="living_area" name="living_area" step="0.1" required min="1">
            </div>
            <button type="submit">Рассчитать стоимость</button>
        </form>

        <div id="result" class="result-container hidden">
            <h2>Результат расчета</h2>
            <p>Стоимость кв. метра: <span id="price-per-meter"></span> ₽</p>
            <p>Общая стоимость: <span id="total-price"></span> ₽</p>
        </div>

        <div id="error" class="error-container hidden"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
